# R CMD check on Windows (where the model executable runs) and Linux.
# On Windows the model is downloaded from the GitHub release "model-5.7", so
# that the tests running the simulations are not skipped.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Download the model executable
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          curl -fsSL -o "$RUNNER_TEMP/model/3D_CMCC_Forest_Model_5.7.exe" \
            https://github.com/VangiElia/R3DFEM/releases/download/model-5.7/3D_CMCC_Forest_Model_5.7.exe
          echo "R3DFEM_EXE=$RUNNER_TEMP/model/3D_CMCC_Forest_Model_5.7.exe" >> "$GITHUB_ENV"
          echo "R3DFEM_TEST_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
